id: java-sqli
name: SQL注入
severity: HIGH
description: 检测通过字符串拼接（JDBC/JPA/Hibernate）产生的SQL注入漏洞。请使用PreparedStatement或参数化查询。
patterns:
  - "(?i)select.*from.*\\+"
  - "(?i)update.*set.*\\+"
  - "(?i)insert.*into.*\\+"
  - "(?i)delete.*from.*\\+"
  - "Statement"
  - "createQuery"
  - "createNativeQuery"
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "query\\("
  - "executeQuery\\("
  - "executeUpdate\\("
  - "execute\\("
  - "createQuery\\("
  - "createNativeQuery\\("
  - "queryForList\\("
  - "queryForObject\\("

