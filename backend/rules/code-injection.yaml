id: java-code-injection
name: 代码/表达式注入
severity: HIGH
description: 检测可能导致代码执行的动态代码或表达式评估。
patterns:
  - "ScriptEngine"
  - "GroovyShell"
  - "ELProcessor"
  - "SpelExpressionParser"
  - "Ognl\\.getValue"
  - "MVEL\\.eval"
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "\\.eval\\("
  - "\\.evaluate\\("
  - "\\.getValue\\("
  - "\\.parseExpression\\("
