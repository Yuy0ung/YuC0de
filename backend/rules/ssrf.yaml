id: java-ssrf
name: 服务器端请求伪造(SSRF)
severity: HIGH
description: Detects SSRF via URL connection or HTTP clients. Validate input URLs against an allowlist.
language: java
patterns:
  - "new URL\\(.*\\)\\.openConnection"
  - "URLConnection"
  - "HttpURLConnection"
  - "HttpClient"
  - "OkHttpClient"
  - "RestTemplate"
  - "ImageIO\\.read"
  - "\\.openConnection\\("
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "new URL\\(.*\\)\\.openConnection"
  - "\\.openConnection\\("
  - "\\.execute\\("
  - "\\.newCall\\("
  - "\\.getForObject\\("
  - "\\.postForObject\\("
  - "ImageIO\\.read\\("
