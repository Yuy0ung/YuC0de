id: java-ssrf
name: 服务器端请求伪造(SSRF)
severity: HIGH
description: 检测通过URL连接或HTTP客户端产生的SSRF漏洞。请根据白名单验证输入URL。
patterns:
  - "new URL\\(.*\\)\\.openConnection"
  - "URLConnection"
  - "HttpURLConnection"
  - "HttpClient"
  - "OkHttpClient"
  - "RestTemplate"
  - "ImageIO\\.read"
  - "\\.openConnection\\("
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "new URL\\(.*\\)\\.openConnection"
  - "\\.openConnection\\("
  - "\\.execute\\("
  - "\\.enqueue\\("
  - "\\.getForObject\\("
  - "\\.openStream\\("
  - "\\.postForObject\\("
  - "ImageIO\\.read\\("

