id: hardcoded-secrets
name: 敏感信息硬编码
severity: HIGH
description: 检测项目中硬编码的敏感信息，如API Key、密码、密钥、Token等。
language: all
patterns:
  # Generic API Key / Secret / Token assignments
  # Matches: apiKey, api_key, awsSecret, clientSecret, secretKey, etc.
  - "(?i)(api|access|client|app|aws|customer)[-_]?(key|token|id|secret)\\s*[:=]\\s*['\"][a-zA-Z0-9_\\-+/=]{8,}['\"]"
  
  # Standalone "secret" or "token" variable
  - "(?i)(secret|token)\\s*[:=]\\s*['\"][a-zA-Z0-9_\\-+/=]{8,}['\"]"
  
  # Generic "KEY" variable with high-entropy value (Hex 32+ chars or Base64 32+ chars)
  # This catches: KEY = "FF38DC304A1D74B19F24A36C09FD6B72"
  # Note: The Base64 pattern [a-zA-Z0-9+/=] also covers Hex [0-9a-fA-F], so we use only the broader one to avoid duplication.
  - "(?i)\\bkey\\s*[:=]\\s*['\"][a-zA-Z0-9+/=]{32,}['\"]"

  # Password assignments
  - "(?i)(password|passwd|pwd)\\s*[:=]\\s*['\"][a-zA-Z0-9!@#$%^&*()_+\\-=\\[\\]{};':,./<>?]{6,}['\"]"
  
  # Common Cloud Keys
  - "(?i)AKIA[0-9A-Z]{16}"
  - "(?i)(aws|s3)?_?secret_?access_?key\\s*[:=]\\s*['\"][0-9a-zA-Z/+]{40}['\"]"
  
  # Private Keys
  - "-----BEGIN ((EC|PGP|DSA|RSA|OPENSSH) )?PRIVATE KEY( BLOCK)?"
  
  # Encryption Keys / Salts
  - "(?i)(salt|iv|encryption_key|aes_key|secret_key)\\s*[:=]\\s*['\"][a-fA-F0-9]{8,}['\"]"
  
  # JWT / Bearer Tokens (starts with eyJ)
  - "eyJ[a-zA-Z0-9\\-_]+\\.[a-zA-Z0-9\\-_]+\\.[a-zA-Z0-9\\-_]+"
  
  # Generic "Authorization: Bearer ..." or similar
  - "(?i)Authorization\\s*[:=]\\s*['\"]Bearer\\s+[a-zA-Z0-9_\\-.]+['\"]"
