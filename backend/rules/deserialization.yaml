id: java-deserialization
name: 不安全的反序列化
severity: HIGH
description: 检测可能导致命令执行的不安全的反序列化漏洞。
language: java
patterns:
  - "readObject\\("
  - "XMLDecoder"
  - "Yaml\\.load"
  - "fromJSON"
  - "readValue"
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "request\\.getInputStream"
  - "request\\.getReader"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "readObject\\("
  - "new XMLDecoder\\("
  - "\\.load\\("
  - "JSON\\.parseObject\\("
  - "\\.readValue\\("