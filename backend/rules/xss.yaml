id: java-xss
name: 跨站脚本攻击(XSS)
severity: MEDIUM
description: Detects potential XSS via direct response writing. Ensure output is encoded/escaped.
language: java
patterns:
  - "response\\.getWriter\\(\\)\\.write\\("
  - "response\\.getWriter\\(\\)\\.print\\("
  - "PrintWriter.*\\.print\\("
  - "PrintWriter.*\\.write\\("
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "request\\.getQueryString"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "\\.print\\("
  - "\\.write\\("
sanitizers:
  - "StringEscapeUtils.escapeHtml"
  - "HtmlUtils.htmlEscape"
  - "URLEncoder.encode"
