id: java-xss
name: 跨站脚本攻击(XSS)
severity: MEDIUM
description: 检测通过直接响应写入产生的潜在XSS漏洞。请确保输出已编码/转义。
patterns:
  - "response\\.getWriter\\(\\)\\.write\\("
  - "response\\.getWriter\\(\\)\\.print\\("
  - "PrintWriter.*\\.print\\("
  - "PrintWriter.*\\.write\\("
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "request\\.getQueryString"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "\\.print\\("
  - "\\.write\\("
sanitizers:
  - "StringEscapeUtils.escapeHtml"
  - "HtmlUtils.htmlEscape"
  - "URLEncoder.encode"

