id: java-xxe
name: XML外部实体注入(XXE)
severity: HIGH
description: 检测未禁用外部实体的XML解析操作。
patterns:
  - "DocumentBuilderFactory"
  - "SAXParserFactory"
  - "XMLInputFactory"
  - "TransformerFactory"
sources:
  - "request\\.getParameter"
  - "request\\.getInputStream"
  - "request\\.getReader"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "\\.parse\\("
  - "\\.transform\\("
  - "\\.newDocumentBuilder\\("
exclude_patterns:
  - "LocalDateTime\\.parse"
  - "Integer\\.parse"
  - "Double\\.parse"
  - "Long\\.parse"
  - "Float\\.parse"
  - "Boolean\\.parse"
  - "Byte\\.parse"
  - "Short\\.parse"
  - "InternetAddress\\.parse"

