id: java-rce
name: 远程代码/命令执行(RCE)
severity: HIGH
description: 检测Java中的命令执行。避免在Runtime.exec或ProcessBuilder中使用用户输入。
patterns:
  - "Runtime\\.getRuntime\\(\\)\\.exec\\("
  - "new ProcessBuilder\\("
  - "ProcessImpl\\.start\\("
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "request\\.getQueryString"
  - "request\\.getCookies"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "Runtime\\.getRuntime\\(\\)\\.exec\\("
  - "ProcessImpl\\.start\\("
  - "\\.start\\(\\)"

