id: java-rce
name: 远程代码/命令执行(RCE)
severity: HIGH
description: Detects command execution in Java. Avoid using Runtime.exec or ProcessBuilder with user input.
language: java
patterns:
  - "Runtime\\.getRuntime\\(\\)\\.exec\\("
  - "new ProcessBuilder\\("
  - "ProcessImpl\\.start\\("
sources:
  - "request\\.getParameter"
  - "request\\.getHeader"
  - "request\\.getQueryString"
  - "request\\.getCookies"
  - "@RequestParam"
  - "@PathVariable"
  - "@RequestBody"
sinks:
  - "Runtime\\.getRuntime\\(\\)\\.exec\\("
  - "new ProcessBuilder\\("
  - "ProcessImpl\\.start\\("
  - "\\.start\\(\\)"
